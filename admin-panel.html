<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="admin-panel.css">
</head>
<body>
    
    <nav class="nav-container">
        <div class="logo">
            <img src="logo.png" alt="">
        </div>
        <div class="search">
            <input type="text" placeholder="Search" id="Search">
        </div>
        <div class="list">
            <ul>
                <li><a href="product.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="admin-panel.html">Dashboard</a></li>
            </ul>
        </div>
    </nav>
    <h2 class="head">Add New Product</h2>
    <div class="add-item">
        <div class="input-fields">
            <div>
                <label for="img">Image</label><br>
                <input type="text" id="img" class="input" placeholder="Enter Image URL"><br>
                <small id="img-error"></small>
            </div>
            <div>
                <label for="name">Name</label><br>
                <input type="text" id="name" class="input" placeholder="Enter Product Name"><br>
                <small id = "name-error"></small>
            </div>
            <div>
                <label for="price">Price</label><br>
                <input type="number" id="price" class="input" placeholder="Enter Price"><br>
                <small id="price-error"></small>
            </div>
            <div>
                <label for="off">Discount</label><br>
                <input type="text" id="off" class="input" placeholder="Enter Discount">
            </div>
            <div>
                <label for="des">Description</label><br>
                <textarea name="desc" id="des" class="input"></textarea>
            </div>
        </div>
            <button class="btn">Add Product</button>
    </div>
    <h2 class="head">Product</h2>
    <div class="product-container"></div>

    <script src="admin-panel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
