<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    
    <nav class="nav-container">
        <div class="logo">
            <img src="logo.png" alt="">
        </div>
        <div class="search">
            <input type="text" placeholder="Search" id="Search">
        </div>
        <div class="list">
            <ul>
                <li><a href="product.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="admin-panel.html">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="slide-container">
        <div class="slider">
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                      <img src="img3.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                      <img src="img2.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                      <img src="img4.png" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <div class="image">
            <img src="img6.png" alt="">
        </div>
    </div>
    <div class="phone">
        <img src="image.png" class="img">
    </div>
    <h2 class="head">Just for You</h2>
    <div id="card-container"></div>

    <div class="modal-overlay" id="imgModal">
        <div class="modal-box">
            <span class="close-btn" id="closeModal">&times;</span>
            <img src="" id="modalImage" alt="Product Image">
            <div class="modal-info">
                <span class="heading" id="modalTitle"></span>
                <p       id="modalDesc"></p>
                <p id="modalPrice" class="para"></p>
            </div>
        </div>
    </div>

    <script src="product.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</body>
</html>
